name: pals-local

# Add this file after docker-compose.yml and pals-infra/docker-compose.localstack.yml.
# All application images, service names, addresses, and Docker resources are stable
# across runs. TLS values are generated by bootstrap-local-verifier-tls.py and are
# deliberately mapped per service instead of importing the complete generated file.
services:
  schema-release:
    image: pals-api:local
    pull_policy: never
    profiles: [release]
    entrypoint: [sh, -ec]
    command:
      - |
        python -m app.release.explanation_retry_migration
        python -m app.release.local_legacy_database_release --apply
        python -m app.release.typed_catalog install
    environment:
      PALS_ENV: local
      PALS_LOCAL_RELEASE_CONTRACT: legacy-local-v1
      PALS_DATABASE_URL: ${PALS_DATABASE_URL:-}
      PALS_TYPED_CATALOG_RELEASE_DATABASE_URL: ${PALS_DATABASE_URL:-}
      PALS_RECIPE_CATALOG_SELECTOR_DATABASE_URL: ${PALS_RECIPE_CATALOG_SELECTOR_DATABASE_URL:-}
      PALS_PFI_DRAFT_READER_DATABASE_URL: ${PALS_PFI_DRAFT_READER_DATABASE_URL:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [e2e, database]

  postgres:
    networks:
      database:
        ipv4_address: 172.30.1.2

  localstack:
    ports: !override
      - "${PALS_HOST_BIND_ADDRESS:-127.0.0.1}:${LOCALSTACK_HOST_PORT:-4566}:4566"
    volumes:
      - ./pals-infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    networks:
      e2e:
        ipv4_address: 172.30.0.3

  cognito-local:
    ports: !override
      - "${PALS_HOST_BIND_ADDRESS:-127.0.0.1}:${COGNITO_LOCAL_HOST_PORT:-9229}:9229"
    volumes:
      - ./pals-infra/cognito-local/config.json:/config/config.json:ro
      - ./pals-infra/cognito-local/entrypoint.sh:/config/entrypoint.sh:ro
    networks:
      e2e:
        ipv4_address: 172.30.0.4

  verifier:
    image: pals-lean-verifier:local
    pull_policy: never
    build:
      context: ./pals-agent
      dockerfile: docker/lean-verifier.Dockerfile
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g
    tmpfs:
      - /run/pals-verifier-requests:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=700
    environment:
      PALS_ENV: local
      PALS_VERIFIER_BIND_HOST: 0.0.0.0
      PALS_LEAN_PROJECT_DIR: /app/lean-workspace
      PALS_LEAN_TIMEOUT_SECONDS: "300"
      PALS_AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      PALS_AWS_ENDPOINT_URL: http://localstack:4566
      PALS_VERIFIER_SERVER_NAME: pals-lean-verifier.pals.internal
      PALS_RELEASE_ID: ${PALS_RELEASE_ID:-}
      PALS_VERIFIER_DEPLOYMENT_BINDING_SHA256: ${PALS_VERIFIER_DEPLOYMENT_BINDING_SHA256:-}
      PALS_VERIFIER_IMAGE_DIGEST: ${PALS_VERIFIER_IMAGE_DIGEST:-}
      PALS_VERIFIER_TOOLCHAIN_SHA256: ${PALS_VERIFIER_TOOLCHAIN_SHA256:-}
      PALS_VERIFIER_CA_SPKI_SHA256: ${PALS_VERIFIER_CA_SPKI_SHA256:-}
      PALS_RECONCILER_CLIENT_SPKI_SHA256: ${PALS_RECONCILER_CLIENT_SPKI_SHA256:-}
      PALS_RECONCILER_CLIENT_SPIFFE_URI: ${PALS_RECONCILER_CLIENT_SPIFFE_URI:-}
      PALS_VERIFIER_SERVER_CERTIFICATE_SECRET_ARN: ${PALS_VERIFIER_SERVER_CERTIFICATE_SECRET_ARN:-}
      PALS_VERIFIER_SERVER_CERTIFICATE_SECRET_VERSION_ID: ${PALS_VERIFIER_SERVER_CERTIFICATE_SECRET_VERSION_ID:-}
      PALS_VERIFIER_SERVER_PRIVATE_KEY_SECRET_ARN: ${PALS_VERIFIER_SERVER_PRIVATE_KEY_SECRET_ARN:-}
      PALS_VERIFIER_SERVER_PRIVATE_KEY_SECRET_VERSION_ID: ${PALS_VERIFIER_SERVER_PRIVATE_KEY_SECRET_VERSION_ID:-}
      PALS_VERIFIER_CA_CERTIFICATE_SECRET_ARN: ${PALS_VERIFIER_CA_CERTIFICATE_SECRET_ARN:-}
      PALS_VERIFIER_CA_CERTIFICATE_SECRET_VERSION_ID: ${PALS_VERIFIER_CA_CERTIFICATE_SECRET_VERSION_ID:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/run/pals-verifier-requests/verifier-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.30.0.50
        aliases:
          - pals-lean-verifier.pals.internal
    restart: unless-stopped

  reconciler:
    image: pals-api:local
    pull_policy: never
    command: ["python", "-m", "app.release.verified_reconciler"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.3
    mem_limit: 384m
    tmpfs:
      - /run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      PALS_ENV: local
      PALS_DATABASE_URL: ${PALS_DATABASE_URL:-}
      PALS_AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      PALS_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PALS_VERIFIER_URL: https://pals-lean-verifier.pals.internal:18117
      PALS_RECONCILER_TRIGGER_BIND_HOST: 0.0.0.0
      PALS_RECONCILER_TRIGGER_ALLOWED_PEER_IP: 172.30.0.20
      PALS_RECONCILER_TRIGGER_PORT: "18118"
      PALS_RELEASE_ID: ${PALS_RELEASE_ID:-}
      PALS_VERIFIER_DEPLOYMENT_BINDING_SHA256: ${PALS_VERIFIER_DEPLOYMENT_BINDING_SHA256:-}
      PALS_VERIFIER_IMAGE_DIGEST: ${PALS_VERIFIER_IMAGE_DIGEST:-}
      PALS_VERIFIER_TOOLCHAIN_SHA256: ${PALS_VERIFIER_TOOLCHAIN_SHA256:-}
      PALS_VERIFIER_CA_SPKI_SHA256: ${PALS_VERIFIER_CA_SPKI_SHA256:-}
      PALS_RECONCILER_CLIENT_SPIFFE_URI: ${PALS_RECONCILER_CLIENT_SPIFFE_URI:-}
      PALS_RECONCILER_CLIENT_CERTIFICATE_SECRET_ARN: ${PALS_RECONCILER_CLIENT_CERTIFICATE_SECRET_ARN:-}
      PALS_RECONCILER_CLIENT_CERTIFICATE_SECRET_VERSION_ID: ${PALS_RECONCILER_CLIENT_CERTIFICATE_SECRET_VERSION_ID:-}
      PALS_RECONCILER_CLIENT_PRIVATE_KEY_SECRET_ARN: ${PALS_RECONCILER_CLIENT_PRIVATE_KEY_SECRET_ARN:-}
      PALS_RECONCILER_CLIENT_PRIVATE_KEY_SECRET_VERSION_ID: ${PALS_RECONCILER_CLIENT_PRIVATE_KEY_SECRET_VERSION_ID:-}
      PALS_VERIFIER_CA_CERTIFICATE_SECRET_ARN: ${PALS_VERIFIER_CA_CERTIFICATE_SECRET_ARN:-}
      PALS_VERIFIER_CA_CERTIFICATE_SECRET_VERSION_ID: ${PALS_VERIFIER_CA_CERTIFICATE_SECRET_VERSION_ID:-}
    healthcheck:
      test: ["CMD", "test", "-f", "/run/pals-reconciler-ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      verifier:
        condition: service_healthy
    networks:
      database: {}
      e2e:
        ipv4_address: 172.30.0.60
        aliases:
          - pals-reconciler
    restart: unless-stopped

  api:
    image: pals-api:local
    pull_policy: never
    # The image default is the production serving gate, which requires a
    # restricted production login role. Local development intentionally uses
    # the single PostgreSQL bootstrap user, so start the same FastAPI app
    # directly while keeping every public route and runtime dependency real.
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    build:
      context: .
      dockerfile: pals-api/Dockerfile
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    # Optional sandbox-only file. The ignored host directory contains only the
    # mode-0600 billing JSON; never put its contents in Compose environment.
    volumes:
      - ./.local/e2e/billing:/run/pals-billing:ro
    environment:
      PALS_ENV: local
      PALS_BILLING_CONFIG_FILE: ${PALS_BILLING_CONFIG_FILE:-}
      PALS_TOKEN_ACCOUNTING_ENABLED: ${PALS_TOKEN_ACCOUNTING_ENABLED:-false}
      PALS_DATABASE_URL: ${PALS_DATABASE_URL:-}
      PALS_LOCAL_RUNTIME_ENABLED: "true"
      PALS_TYPED_CATALOG_RELEASE_SECRET: ${PALS_TYPED_CATALOG_RELEASE_SECRET:-}
      PALS_AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      PALS_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PALS_SQS_PROOF_JOBS_QUEUE_URL: http://localstack:4566/000000000000/${PALS_PROOF_JOBS_QUEUE_NAME:-pals-local-proof-jobs}
      PALS_SQS_PROOF_REQUESTS_QUEUE_URL: http://localstack:4566/000000000000/${PALS_PROOF_REQUESTS_QUEUE_NAME:-pals-local-proof-requests}
      PALS_S3_ARTIFACT_BUCKET: ${PALS_ARTIFACTS_BUCKET:-pals-local-artifacts}
      # Resolve on the e2e network so the source matches the reconciler's API peer.
      PALS_CANDIDATE_RECONCILER_URL: http://pals-reconciler:18118
      PALS_COGNITO_USER_POOL_ID: ${PALS_COGNITO_USER_POOL_ID:-}
      PALS_COGNITO_APP_CLIENT_ID: ${PALS_COGNITO_APP_CLIENT_ID:-}
      PALS_COGNITO_ISSUER: ${PALS_COGNITO_ISSUER:-}
      PALS_COGNITO_JWKS_URL: http://cognito-local:9229/${PALS_COGNITO_USER_POOL_ID:-}/.well-known/jwks.json
      PALS_CORS_ALLOWED_ORIGINS: http://localhost:${PALS_WEB_HOST_PORT:-3000},http://127.0.0.1:${PALS_WEB_HOST_PORT:-3000}
      PALS_WORKER_SHARED_SECRET: ${PALS_WORKER_SHARED_SECRET:-}
      PALS_RECIPE_WORKER_SECRET: ${PALS_RECIPE_WORKER_SECRET:-}
      PALS_RECIPE_SEMANTIC_REVIEWER_SECRET: ${PALS_RECIPE_SEMANTIC_REVIEWER_SECRET:-}
      PALS_RECIPE_SEMANTIC_REVIEWER_PRINCIPAL: ${PALS_RECIPE_SEMANTIC_REVIEWER_PRINCIPAL:-}
      PALS_RECIPE_CATALOG_SELECTOR_DATABASE_URL: ${PALS_RECIPE_CATALOG_SELECTOR_DATABASE_URL:-}
      PALS_PFI_DRAFT_READER_DATABASE_URL: ${PALS_PFI_DRAFT_READER_DATABASE_URL:-}
      PALS_RECIPE_CATALOG_ACTIVE_LEAN_VERSION: ${PALS_RECIPE_CATALOG_ACTIVE_LEAN_VERSION:-}
      PALS_RECIPE_CATALOG_ACTIVE_LAKE_MANIFEST_SHA256: ${PALS_RECIPE_CATALOG_ACTIVE_LAKE_MANIFEST_SHA256:-}
      PALS_RECIPE_CATALOG_ACTIVE_VERIFIER_SHA256: ${PALS_RECIPE_CATALOG_ACTIVE_VERIFIER_SHA256:-}
      PALS_PROOF_GENERATION_CLAIM_LEASE_MS: "3600000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      cognito-local:
        condition: service_healthy
      reconciler:
        condition: service_healthy
    ports:
      - "${PALS_HOST_BIND_ADDRESS:-127.0.0.1}:${PALS_API_HOST_PORT:-8000}:8000"
    networks:
      database: {}
      e2e:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # During migration, consume old assessment receipts still in the formal queue.
  # New requests go only to the dedicated queue. Set lane=proof once old receipts drain.
  worker: &proof-worker
    image: pals-agent-worker:local
    pull_policy: never
    # Trusted local startup installs namespace-only egress rules, then drops
    # UID/GID and every capability (including bounding) before worker execution.
    user: "0:0"
    entrypoint: [python, -m, pals_agent.local_worker_boundary]
    stop_grace_period: 65m
    command: [pals-agent, worker, --lane, "${PALS_PROOF_WORKER_LANE:-all}", --ready-file, /tmp/pals-worker-ready]
    build:
      context: ./pals-agent
      dockerfile: Dockerfile.local
    healthcheck:
      test: [CMD, setpriv, --reuid=65532, --regid=65532, --clear-groups, --bounding-set=-all, --inh-caps=-all, --ambient-caps=-all, --no-new-privs, python, -c, "from pathlib import Path; import os; os.kill(int(Path('/tmp/pals-worker-ready').read_text()),0)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    read_only: true
    cap_drop:
      - ALL
    cap_add: [NET_ADMIN, SETUID, SETGID, SETPCAP]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    environment: &worker-environment
      PALS_ENV: local
      PALS_LOCAL_WORKER_NETWORK_GUARD: "1"
      PALS_TOKEN_ACCOUNTING_ENABLED: ${PALS_TOKEN_ACCOUNTING_ENABLED:-false}
      PALS_LOCAL_DENIED_TCP_PORT: ${POSTGRES_HOST_PORT:-55432}
      PALS_AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      PALS_AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PALS_SQS_PROOF_JOBS_QUEUE_URL: http://localstack:4566/000000000000/${PALS_PROOF_JOBS_QUEUE_NAME:-pals-local-proof-jobs}
      PALS_SQS_PROOF_REQUESTS_QUEUE_URL: http://localstack:4566/000000000000/${PALS_PROOF_REQUESTS_QUEUE_NAME:-pals-local-proof-requests}
      PALS_S3_ARTIFACT_BUCKET: ${PALS_ARTIFACTS_BUCKET:-pals-local-artifacts}
      PALS_API_BASE_URL: http://api:8000
      PALS_TYPED_CATALOG_ENABLED: "true"
      PALS_WORKER_SHARED_SECRET: ${PALS_WORKER_SHARED_SECRET:-}
      PALS_RECIPE_WORKER_SECRET: ${PALS_RECIPE_WORKER_SECRET:-}
      PALS_RECIPE_REVIEWER_URL: http://pals-recipe-reviewer:18119
      PALS_RECIPE_REVIEW_REQUESTER_SECRET: ${PALS_RECIPE_REVIEW_REQUESTER_SECRET:-}
      PALS_RECIPE_ACTIVE_LEAN_VERSION: ${PALS_RECIPE_ACTIVE_LEAN_VERSION:-}
      PALS_RECIPE_ACTIVE_LAKE_MANIFEST_SHA256: ${PALS_RECIPE_ACTIVE_LAKE_MANIFEST_SHA256:-}
      PALS_RECIPE_VERIFIER_SHA256: ${PALS_RECIPE_VERIFIER_SHA256:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PALS_OPENAI_BASE_URL: https://api.openai.com/v1
      PALS_OPENAI_MAX_OUTPUT_TOKENS: ${PALS_OPENAI_MAX_OUTPUT_TOKENS:-12000}
      PALS_DRAFT_EMBEDDING_PROVIDER: openai
      PALS_DRAFT_EMBEDDING_MODEL: text-embedding-3-small
      PALS_DRAFT_EMBEDDING_REVISION: openai-text-embedding-3-small-v1
      PALS_DRAFT_EMBEDDING_DIM: "384"
      PALS_DRAFT_EMBEDDING_DEPLOYMENT_IDENTITY: openai-public
    depends_on:
      api:
        condition: service_healthy
      recipe-reviewer:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.30.0.30
    restart: unless-stopped

  assessment-worker:
    <<: *proof-worker
    # Reuse the same image, API and database. Each replica consumes only assessments.
    command: [pals-agent, worker, --lane, assessment, --ready-file, /tmp/pals-worker-ready]
    environment:
      <<: *worker-environment
      PALS_PROOF_CAPABILITY: natural-only
    cpus: ${PALS_ASSESSMENT_WORKER_CPUS:-1.0}
    mem_limit: ${PALS_ASSESSMENT_WORKER_MEMORY:-1g}
    memswap_limit: ${PALS_ASSESSMENT_WORKER_MEMORY:-1g}
    pids_limit: 64
    depends_on:
      api:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      e2e: {}

  recipe-reviewer:
    image: pals-agent-worker:local
    pull_policy: never
    command: [python, -m, pals_agent.recipe_semantic_reviewer]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 384m
    cpus: 0.3
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      PALS_API_BASE_URL: http://api:8000
      PALS_RECIPE_SEMANTIC_REVIEWER_SECRET: ${PALS_RECIPE_SEMANTIC_REVIEWER_SECRET:-}
      PALS_RECIPE_REVIEW_REQUESTER_SECRET: ${PALS_RECIPE_REVIEW_REQUESTER_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PALS_OPENAI_BASE_URL: https://api.openai.com/v1
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',18119),2).close()"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      api:
        condition: service_healthy
    networks:
      e2e:
        ipv4_address: 172.30.0.70
        aliases: [pals-recipe-reviewer]
    restart: unless-stopped

  webfront:
    image: pals-webfront:local
    pull_policy: never
    build:
      context: ./pals-webfront
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PALS_API_BASE_URL: http://localhost:${PALS_API_HOST_PORT:-8000}
        NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${PALS_COGNITO_USER_POOL_ID:-}
        NEXT_PUBLIC_COGNITO_CLIENT_ID: ${PALS_COGNITO_APP_CLIENT_ID:-}
        NEXT_PUBLIC_COGNITO_ENDPOINT: http://localhost:${COGNITO_LOCAL_HOST_PORT:-9229}
        NEXT_PUBLIC_COGNITO_GOOGLE_ENABLED: "false"
        NEXT_PUBLIC_COGNITO_REDIRECT_URI: http://localhost:${PALS_WEB_HOST_PORT:-3000}
        NEXT_PUBLIC_COGNITO_LOGOUT_URI: http://localhost:${PALS_WEB_HOST_PORT:-3000}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      cognito-local:
        condition: service_healthy
    ports:
      - "${PALS_HOST_BIND_ADDRESS:-127.0.0.1}:${PALS_WEB_HOST_PORT:-3000}:3000"
    networks:
      e2e:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

networks:
  database:
    name: pals-local-database
    driver: bridge
    # Host loopback publishing must remain available on OrbStack. Database
    # worker namespace rules enforce TCP isolation; HBA is secondary defense.
    internal: false
    ipam:
      config:
        - subnet: 172.30.1.0/24
  e2e:
    name: pals-local-e2e
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
