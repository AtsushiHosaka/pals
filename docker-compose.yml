name: pals-local

# Local development keeps only the shared database in Docker.
# API, web, agent, Lean, and Ollama run explicitly on the host when needed.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pals}
      POSTGRES_USER: ${POSTGRES_USER:-pals}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pals}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${PALS_HOST_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres-data:
