name: PALS parent checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-acceptance-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - name: Require the exact candidate source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
      - name: Verify deterministic acceptance contracts (not live E2E)
        run: bash pals-scripts/tests/release-acceptance.sh
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact candidate source
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
      - name: Install the checksum-pinned history scanner
        run: |
          bash pals-scripts/install-gitleaks.sh "$RUNNER_TEMP/pals-gitleaks"
          echo "$RUNNER_TEMP/pals-gitleaks" >> "$GITHUB_PATH"
      - name: Check parent secrets including available history
        run: bash pals-scripts/check-secrets.sh --scope parent --history
      - name: Verify secret gate regression cases
        run: |
          bash pals-scripts/tests/secret-ignore.sh
          bash pals-scripts/tests/secrets-gate.sh
      - name: Verify release source CI selection
        run: python3 pals-scripts/tests/test_release_source_checks.py
      - name: Check out the pinned public agent
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init --depth 1 -- pals-agent
      - name: Prepare an isolated wheel builder
        run: |
          python3 -m venv "${RUNNER_TEMP}/pals-boundary-build"
          "${RUNNER_TEMP}/pals-boundary-build/bin/python" -m pip install build
          echo "${RUNNER_TEMP}/pals-boundary-build/bin" >> "${GITHUB_PATH}"
      - run: bash pals-scripts/check-public-agent-boundary.sh
