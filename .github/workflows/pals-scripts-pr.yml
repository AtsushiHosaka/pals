name: PALS parent checks

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          persist-credentials: false
      - run: bash pals-scripts/check-secrets.sh
      - run: bash pals-scripts/check-public-agent-boundary.sh
