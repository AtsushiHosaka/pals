name: QA Pro operator on Mac mini

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect the host, install the reviewed v6 authority, or grant permanent QA Pro
        type: choice
        options: [inspect, install, grant]
        default: inspect
        required: true
      subject:
        description: Cognito subject UUID (grant only; never enter an email or password)
        type: string
        default: ''
      grant_id:
        description: Stable grant UUID for idempotent replay (grant only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  operator:
    if: >-
      github.repository == 'AtsushiHosaka/pals' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      vars.MACMINI_RUNNER_READY == 'true' &&
      vars.MACMINI_CHECKOUT_AUTH == 'host-gh'
    runs-on: [self-hosted, macOS, ARM64, pals-macmini]
    environment: macmini
    timeout-minutes: 15
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin:/Users/hosakaatsushi/.orbstack/bin
      PALS_OPERATOR_MODE: ${{ inputs.mode }}
      PALS_DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout the exact parent
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          path: macmini-deploy
          submodules: false
          persist-credentials: false
          clean: true
      - name: Checkout pinned submodules with the existing host authentication
        working-directory: macmini-deploy
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B pals-scripts/checkout-macmini-submodules.py \
            --source-dir "$GITHUB_WORKSPACE/macmini-deploy" --revision "$PALS_DEPLOY_REVISION"
      - name: Run the guarded host operator
        working-directory: macmini-deploy
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B - <<'PY'
          import os
          import json
          import subprocess
          from pathlib import Path
          from uuid import UUID

          mode = os.environ['PALS_OPERATOR_MODE']
          if mode not in {'inspect', 'install', 'grant'}:
              raise SystemExit('Unsupported operator mode.')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          subject = event.get('inputs', {}).get('subject', '')
          grant_id = event.get('inputs', {}).get('grant_id', '')
          if mode == 'grant':
              try:
                  valid = str(UUID(subject)) == subject and str(UUID(grant_id)) == grant_id and UUID(grant_id).version == 4
              except (ValueError, TypeError, AttributeError):
                  valid = False
              if not valid:
                  raise SystemExit('Canonical subject and grant UUIDs are required.')
              print('::add-mask::' + subject, flush=True)
          elif subject or grant_id:
              raise SystemExit('Account identifiers are only accepted in grant mode.')
          source = Path.cwd().resolve()
          args = [
              '/Users/hosakaatsushi/pals-mini-deploy/auto-recovery/runtime/bin/python',
              '-B', str(source / 'pals-infra/host/macmini-deploy/qa_pro_operator.py'),
              '--mode', mode, '--source-dir', str(source),
              '--expected-parent', os.environ['PALS_DEPLOY_REVISION'],
          ]
          if mode == 'grant':
              args += [
                  '--subject', subject,
                  '--grant-id', grant_id,
                  '--reason', 'Permanent complimentary Pro for authorized QA',
              ]
          environment = dict(os.environ)
          raise SystemExit(subprocess.run(args, env=environment, check=False).returncode)
          PY
      - name: Inspect fixed host interpreter availability
        if: inputs.mode == 'inspect'
        shell: bash
        run: |
          /usr/bin/python3 -B - <<'PYHOST'
          import json
          import os
          import subprocess
          from pathlib import Path
          candidates = {
              'review_controller_interpreter_available': Path('/Users/hosakaatsushi/Documents/Codex/2026-10-02/task-3/.venv-review/bin/python'),
              'operating_interpreter_available': Path('/Users/hosakaatsushi/pals-mini-deploy/auto-recovery/runtime/bin/python'),
          }
          results = {key: path.is_file() and os.access(path, os.X_OK) for key, path in candidates.items()}
          for key, path in candidates.items():
              try:
                  probe = subprocess.run([str(path), '-I', '-c', 'print("pals-interpreter-ready")'], capture_output=True, timeout=5, check=False)
                  results[key.replace('_available', '_starts')] = probe.returncode == 0 and probe.stdout == b'pals-interpreter-ready\n'
              except (OSError, subprocess.TimeoutExpired):
                  results[key.replace('_available', '_starts')] = False
          root = Path('/Users/hosakaatsushi/pals-mini-deploy')
          config = json.loads((root / 'deploy-config.json').read_bytes())
          policy = json.loads((root / 'controller-policy.json').read_bytes())
          results['deployment_state_matches_host_state'] = Path(config['state_dir']) == Path(policy['state_dir'])
          print(json.dumps(results))
          PYHOST
