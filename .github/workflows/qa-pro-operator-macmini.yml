name: QA Pro operator on Mac mini

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect Lean prerequisites, stage reviewed worker support, maintain authority or edge routes, or grant QA Pro
        type: choice
        options: [inspect, inspect-material-ocr, inspect-lean, stage-lean-worker, inspect-lean-support, refresh-lean-support, inspect-lean-runtime, enable-lean-runtime, recover-lean-runtime, finalize-lean-runtime, inspect-lean-queue, prepare-lean-queue, inspect-edge, install-edge, plan-materials-edge, install-materials-edge, plan-natural-capability, plan-natural-capability-apply, apply-natural-capability, recover-natural-capability, install, install-chat, recover, grant]
        default: inspect
        required: true
      stage_plan_sha256:
        description: Exact reviewed support plan SHA256 (stage-lean-worker or refresh-lean-support only)
        type: string
        default: ''
      runtime_plan_sha256:
        description: Exact reviewed runtime or queue plan SHA256 (enable-lean-runtime or prepare-lean-queue only)
        type: string
        default: ''
      verified_job_id:
        description: Exact newly verified and delivered proof job UUID (finalize-lean-runtime only)
        type: string
        default: ''
      edge_plan_sha256:
        description: Exact reviewed current-config edge plan SHA256 (install-materials-edge only)
        type: string
        default: ''
      natural_capability_plan_sha256:
        description: Exact separate API declaration apply plan SHA256 (apply/recover-natural-capability only)
        type: string
        default: ''
      subject:
        description: Cognito subject UUID (grant only; never enter an email or password)
        type: string
        default: ''
      grant_id:
        description: Stable grant UUID for idempotent replay (grant only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-macmini
  cancel-in-progress: false

jobs:
  operator:
    if: >-
      github.repository == 'AtsushiHosaka/pals' &&
      github.event.repository.private == true &&
      github.ref == 'refs/heads/main' &&
      vars.MACMINI_RUNNER_READY == 'true' &&
      vars.MACMINI_CHECKOUT_AUTH == 'host-gh'
    runs-on: [self-hosted, macOS, ARM64, pals-macmini]
    environment: macmini
    timeout-minutes: 15
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin:/Users/hosakaatsushi/.orbstack/bin
      PALS_OPERATOR_MODE: ${{ inputs.mode }}
      PALS_DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout the exact parent
        id: parent-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: macmini-deploy
          submodules: false
          persist-credentials: false
          clean: true
      - name: Checkout pinned submodules with the existing host authentication
        working-directory: macmini-deploy
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B pals-scripts/checkout-macmini-submodules.py \
            --source-dir "$GITHUB_WORKSPACE/macmini-deploy" --revision "$PALS_DEPLOY_REVISION"
      - name: Run the guarded host operator
        working-directory: macmini-deploy
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B - <<'PY'
          import os
          import json
          import re
          import subprocess
          from pathlib import Path
          from uuid import UUID

          mode = os.environ['PALS_OPERATOR_MODE']
          if mode not in {'inspect', 'inspect-material-ocr', 'inspect-lean', 'stage-lean-worker', 'inspect-lean-support', 'refresh-lean-support', 'inspect-lean-runtime', 'enable-lean-runtime', 'recover-lean-runtime', 'finalize-lean-runtime', 'inspect-lean-queue', 'prepare-lean-queue', 'inspect-edge', 'install-edge', 'plan-materials-edge', 'install-materials-edge', 'plan-natural-capability', 'plan-natural-capability-apply', 'apply-natural-capability', 'recover-natural-capability', 'install', 'install-chat', 'recover', 'grant'}:
              raise SystemExit('Unsupported operator mode.')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          stage_plan = event.get('inputs', {}).get('stage_plan_sha256', '')
          if mode in {'stage-lean-worker', 'refresh-lean-support'}:
              if not isinstance(stage_plan, str) or re.fullmatch(r'[0-9a-f]{64}', stage_plan) is None:
                  raise SystemExit('An exact reviewed stage plan SHA256 is required.')
          elif stage_plan:
              raise SystemExit('A stage plan is only accepted in a support apply mode.')
          runtime_plan = event.get('inputs', {}).get('runtime_plan_sha256', '')
          if mode in {'enable-lean-runtime', 'prepare-lean-queue'}:
              if not isinstance(runtime_plan, str) or re.fullmatch(r'[0-9a-f]{64}', runtime_plan) is None:
                  raise SystemExit('An exact reviewed runtime or queue plan SHA256 is required.')
          elif runtime_plan:
              raise SystemExit('A runtime or queue plan is only accepted in its apply mode.')
          edge_plan = event.get('inputs', {}).get('edge_plan_sha256', '')
          if mode == 'install-materials-edge':
              if not isinstance(edge_plan, str) or re.fullmatch(r'[0-9a-f]{64}', edge_plan) is None:
                  raise SystemExit('An exact reviewed edge plan SHA256 is required.')
          elif edge_plan:
              raise SystemExit('An edge plan is only accepted in install-materials-edge mode.')
          natural_plan = event.get('inputs', {}).get('natural_capability_plan_sha256', '')
          if mode in {'apply-natural-capability', 'recover-natural-capability'}:
              if not isinstance(natural_plan, str) or re.fullmatch(r'[0-9a-f]{64}', natural_plan) is None:
                  raise SystemExit('An exact separate natural capability apply plan SHA256 is required.')
          elif natural_plan:
              raise SystemExit('A natural capability plan is only accepted in its apply or recover mode.')
          verified_job = event.get('inputs', {}).get('verified_job_id', '')
          if mode == 'finalize-lean-runtime':
              if not isinstance(verified_job, str) or re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}', verified_job) is None:
                  raise SystemExit('A canonical UUID4 newly verified proof job is required.')
          elif verified_job:
              raise SystemExit('A verified job is only accepted in finalize-lean-runtime mode.')
          subject = event.get('inputs', {}).get('subject', '')
          grant_id = event.get('inputs', {}).get('grant_id', '')
          if mode == 'grant':
              try:
                  valid = str(UUID(subject)) == subject and str(UUID(grant_id)) == grant_id and UUID(grant_id).version == 4
              except (ValueError, TypeError, AttributeError):
                  valid = False
              if not valid:
                  raise SystemExit('Canonical subject and grant UUIDs are required.')
              print('::add-mask::' + subject, flush=True)
          elif subject or grant_id:
              raise SystemExit('Account identifiers are only accepted in grant mode.')
          source = Path.cwd().resolve()
          script = ('pals-infra/host/macmini-deploy/full_runtime_operator.py'
                    if mode in {'inspect-lean', 'stage-lean-worker', 'inspect-lean-support', 'refresh-lean-support'} else
                    'pals-infra/host/macmini-deploy/initial_full_runtime_operator.py'
                    if mode in {'inspect-lean-runtime', 'enable-lean-runtime', 'recover-lean-runtime', 'finalize-lean-runtime'} else
                    'pals-infra/host/macmini-deploy/assessment_queue_operator.py'
                    if mode in {'inspect-lean-queue', 'prepare-lean-queue'} else
                    'pals-infra/host/macmini-edge/chat_attachments_operator.py'
                    if mode in {'inspect-edge', 'install-edge'} else
                    'pals-infra/host/macmini-edge/project_materials_operator.py'
                    if mode in {'plan-materials-edge', 'install-materials-edge'} else
                    'pals-infra/host/macmini-deploy/natural_capability_operator.py'
                    if mode in {'plan-natural-capability', 'plan-natural-capability-apply', 'apply-natural-capability', 'recover-natural-capability'} else 'pals-infra/host/macmini-deploy/qa_pro_operator.py')
          args = [
              '/Users/hosakaatsushi/pals-mini-deploy/auto-recovery/runtime/bin/python',
              '-B', str(source / script),
              '--mode', {'inspect-lean': 'plan', 'stage-lean-worker': 'stage-worker',
                         'inspect-lean-support': 'plan-support', 'refresh-lean-support': 'refresh-support',
                         'inspect-lean-runtime': 'plan', 'enable-lean-runtime': 'apply',
                         'recover-lean-runtime': 'recover', 'finalize-lean-runtime': 'finalize', 'inspect-lean-queue': 'plan',
                         'prepare-lean-queue': 'apply', 'plan-natural-capability': 'plan',
                         'plan-natural-capability-apply': 'plan-apply', 'apply-natural-capability': 'apply',
                         'recover-natural-capability': 'recover'}.get(mode, mode),
              '--source-dir', str(source),
              '--expected-parent', os.environ['PALS_DEPLOY_REVISION'],
          ]
          if mode in {'stage-lean-worker', 'refresh-lean-support'}:
              args += ['--expected-stage-plan-sha256', stage_plan]
          if mode in {'enable-lean-runtime', 'prepare-lean-queue'}:
              args += ['--expected-plan-sha256', runtime_plan]
          if mode == 'install-materials-edge':
              args += ['--expected-plan-sha256', edge_plan]
          if mode in {'apply-natural-capability', 'recover-natural-capability'}:
              args += ['--expected-plan-sha256', natural_plan]
          if mode == 'finalize-lean-runtime':
              args += ['--verified-job-id', verified_job]
          if mode == 'grant':
              args += [
                  '--subject', subject,
                  '--grant-id', grant_id,
                  '--reason', 'Permanent complimentary Pro for authorized QA',
              ]
          environment = dict(os.environ)
          raise SystemExit(subprocess.run(args, env=environment, check=False).returncode)
          PY
      - name: Inspect fixed host interpreter availability
        if: always() && inputs.mode == 'inspect' && steps.parent-checkout.outcome == 'success'
        shell: bash
        run: |
          /usr/bin/python3 -B - <<'PYHOST'
          import json
          import os
          import subprocess
          from pathlib import Path
          candidates = {
              'review_controller_interpreter_available': Path('/Users/hosakaatsushi/Documents/Codex/2026-10-02/task-3/.venv-review/bin/python'),
              'operating_interpreter_available': Path('/Users/hosakaatsushi/pals-mini-deploy/auto-recovery/runtime/bin/python'),
          }
          results = {key: path.is_file() and os.access(path, os.X_OK) for key, path in candidates.items()}
          for key, path in candidates.items():
              try:
                  probe = subprocess.run([str(path), '-I', '-c', 'print("pals-interpreter-ready")'], capture_output=True, timeout=5, check=False)
                  results[key.replace('_available', '_starts')] = probe.returncode == 0 and probe.stdout == b'pals-interpreter-ready\n'
              except (OSError, subprocess.TimeoutExpired):
                  results[key.replace('_available', '_starts')] = False
          root = Path('/Users/hosakaatsushi/pals-mini-deploy')
          config = json.loads((root / 'deploy-config.json').read_bytes())
          policy = json.loads((root / 'controller-policy.json').read_bytes())
          results['deployment_state_matches_host_state'] = Path(config['state_dir']) == Path(policy['state_dir'])
          print(json.dumps(results))
          PYHOST
          /usr/bin/python3 -B macmini-deploy/pals-scripts/inspect-macmini-lock.py
